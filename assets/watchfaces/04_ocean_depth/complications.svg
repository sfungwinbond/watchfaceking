      <stop offset="0" stop-color="#075f73"/><stop offset="1" stop-color="#031b2b"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ffff"/><stop offset=".48" stop-color="#c8e8ed"/><stop offset="1" stop-color="#e9ffff"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#643dff"/><stop offset=".5" stop-color="#1bc7c0"/><stop offset="1" stop-color="#7dff78"/>
