  <g filter="url(#shadow)"><g transform="rotate(304 512 512)"><path d="M512 548 L498 512 L508 250 L516 250 L526 512 Z" fill="#65d6ff" filter="url(#glow)"/></g><g transform="rotate(54 512 512)"><path d="M512 550 L502 512 L509 132 L515 132 L522 512 Z" fill="#2fffe7" filter="url(#glow)"/></g><g transform="rotate(216 512 512)"><line x1="512" y1="586" x2="512" y2="116" stroke="#ff3ca6" stroke-width="7" stroke-linecap="round"/><circle cx="512" cy="176" r="20" fill="none" stroke="#ff3ca6" stroke-width="7"/></g>
    <circle cx="512" cy="512" r="31" fill="url(#metal)" stroke="#07101f" stroke-width="6"/><circle cx="512" cy="512" r="10" fill="#ff3ca6"/></g>
</svg>
