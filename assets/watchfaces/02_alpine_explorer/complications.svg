<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Alpine Explorer complications overlay">
  <defs>
    <radialGradient id="dial" cx="42%" cy="34%" r="68%">
      <stop offset="0" stop-color="#29483a"/><stop offset="1" stop-color="#10261e"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efd9"/><stop offset=".48" stop-color="#d8d0b8"/><stop offset="1" stop-color="#f3efd9"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#643dff"/><stop offset=".5" stop-color="#1bc7c0"/><stop offset="1" stop-color="#7dff78"/>
