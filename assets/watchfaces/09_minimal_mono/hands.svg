<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Minimal Mono hands overlay">
  <defs>
    <radialGradient id="dial" cx="42%" cy="34%" r="68%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f6f3"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121417"/><stop offset=".48" stop-color="#36393d"/><stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#643dff"/><stop offset=".5" stop-color="#1bc7c0"/><stop offset="1" stop-color="#7dff78"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    </defs>
  <g filter="url(#shadow)"><g transform="rotate(304 512 512)"><rect x="500" y="282" width="24" height="270" rx="12" fill="#121417"/></g><g transform="rotate(54 512 512)"><rect x="504" y="146" width="16" height="402" rx="8" fill="#121417"/></g><g transform="rotate(216 512 512)"><line x1="512" y1="586" x2="512" y2="116" stroke="#e64545" stroke-width="7" stroke-linecap="round"/><circle cx="512" cy="176" r="20" fill="none" stroke="#e64545" stroke-width="7"/></g>
    <circle cx="512" cy="512" r="31" fill="url(#metal)" stroke="#f6f6f3" stroke-width="6"/><circle cx="512" cy="512" r="10" fill="#e64545"/></g>
</svg>
