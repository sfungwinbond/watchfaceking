<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#efede6">
    <meta name="description" content="Ten original technical streetwear studies shown front and back.">
    <title>Model Weights — Watchface King</title>
    <link rel="stylesheet" href="shirts.css">
    <script src="shirts.js" defer></script>
  </head>
  <body>
    <nav>
      <a class="mark" href="/">W/K</a>
      <div class="nav-links"><a href="/">Watches</a><a class="active" href="shirts">Model Weights</a><a href="checkout">Checkout</a></div>
    </nav>

    <header class="shirt-hero">
      <p class="kicker">Edition 001 · Technical streetwear</p>
      <h1>MODEL<br><span>WEIGHTS</span></h1>
      <div class="hero-meta"><p>Ten original studies.<br>Front and back.</p><p>XS—3XL<br>Premium edition.</p></div>
    </header>

    <main id="shirtGrid" class="shirt-grid" aria-live="polite"></main>

    <footer><a href="/">← Watch collection</a><p>Original unbranded concepts · Simulated store</p></footer>

    <template id="shirtTemplate">
      <article class="shirt-card">
        <div class="shirt-views">
          <figure><img class="front" alt=""><figcaption>Front</figcaption></figure>
          <figure><img class="back" alt=""><figcaption>Back</figcaption></figure>
        </div>
        <div class="shirt-info">
          <div><p class="edition"></p><h2></h2><p class="subline"></p></div>
          <div class="purchase"><p class="price"></p><p class="sizes">XS · S · M · L · XL · 2XL · 3XL</p><a class="buy" href="checkout">Select size</a></div>
        </div>
      </article>
    </template>
  </body>
</html>
